name: Bybit Demo Bot Tests

on:
  push:
    branches:
      - repair/bybit-demo-dashboard
  pull_request:
    branches:
      - repair/bybit-demo-dashboard

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Build clean project ZIP
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import pathlib, zipfile, subprocess
          root = pathlib.Path('.')
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          output = pathlib.Path('dist/bybit-demo-futures-bot.zip')
          output.parent.mkdir(exist_ok=True)
          excluded = {'.env', '.env.local'}
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in tracked:
                  if not name:
                      continue
                  path = pathlib.PurePosixPath(name)
                  if any(part in {'.git', '.venv', '__pycache__', '.pytest_cache'} for part in path.parts):
                      continue
                  if path.name in excluded or path.suffix in {'.pyc', '.sqlite', '.db'}:
                      continue
                  file_path = root / name
                  if file_path.is_file():
                      archive.write(file_path, pathlib.Path('bybit-demo-futures-bot') / path)
          PY
      - name: Upload ZIP
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: bybit-demo-futures-bot
          path: dist/bybit-demo-futures-bot.zip
          if-no-files-found: error
          retention-days: 14
